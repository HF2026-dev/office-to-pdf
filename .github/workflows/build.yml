name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    # 用户的 Mac 是 Intel；GitHub 的 Intel 机子（macos-13）排队 1 小时没轮上，
    # 改用 macos-15（ARM，充足）+ Rosetta 跑 x86_64 Python 打 Intel 版。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install universal2 Python 3.12
        run: |
          curl -LO https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg python-3.12.7-macos11.pkg -target /
          /usr/local/bin/python3.12 --version
          arch -x86_64 /usr/local/bin/python3.12 --version
      - name: Install PyInstaller (x86_64 under Rosetta)
        run: arch -x86_64 /usr/local/bin/python3.12 -m pip install --upgrade pip pyinstaller
      - name: Build Mac app (Intel x86_64)
        run: arch -x86_64 /usr/local/bin/python3.12 -m PyInstaller --noconfirm --windowed --onefile --target-arch x86_64 --name "Office转PDF" office_to_pdf.py
      - name: Check bundle arch
        run: |
          ls -la dist/
          lipo -archs "dist/Office转PDF.app/Contents/MacOS/Office转PDF"
          file "dist/Office转PDF.app/Contents/MacOS/Office转PDF"
      - name: Zip app
        run: ditto -c -k --keepParent "dist/Office转PDF.app" Office转PDF_Mac_v1.0.zip && ls -la *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Office转PDF_Mac_v1.0
          path: Office转PDF_Mac_v1.0.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build Windows exe
        run: pyinstaller --noconfirm --windowed --onefile --name "Office转PDF" office_to_pdf.py
      - name: Check exe
        run: Get-Item dist\Office转PDF.exe | Format-List Name,Length
      - name: Zip exe
        run: Compress-Archive -Path dist\Office转PDF.exe -DestinationPath Office转PDF_Windows_v1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Office转PDF_Windows_v1.0
          path: Office转PDF_Windows_v1.0.zip
